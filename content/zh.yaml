pricing_page:
  title: "价格"
  headline: "适合各种规模事务所的简单定价"
  sub: "[最终价格文案]"
  table_placeholder: "[STRIPE 价格表] 由 Annuit 在 Stripe 后台生成嵌入代码。"
  faq_title: "常见问题"
  faq:
    - q: "Annuit 会取代我的报税软件吗？"
      a: "不会。Annuit 负责报税前的文件收集、整理和核对。请继续使用您现有的报税软件。"
    - q: "Annuit 支持哪些语言？"
      a: "英文、西班牙文和中文。为每位客户选择语言后，Annuit 为其起草的所有消息都会使用该语言。"
    - q: "购买前可以先看看吗？"
      a: "可以。预约演示，我们会和您一起看一个示例客户。"
    - q: "客户文件存储在哪里？"
      a: "请查看安全页面，了解 Annuit 如何存储和保护客户数据。"


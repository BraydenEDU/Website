pricing_page:
  title: "Precios"
  headline: "Precios simples para firmas de todos los tamaños"
  sub: "[TEXTO FINAL DE PRECIOS]"
  table_placeholder: "[TABLA DE PRECIOS STRIPE] Annuit genera el código en el panel de Stripe."
  faq_title: "Preguntas"
  faq:
    - q: "¿Annuit reemplaza mi software de impuestos?"
      a: "No. Annuit se encarga de recolectar, organizar y revisar documentos antes de la preparación. Siga usando su software actual."
    - q: "¿Qué idiomas admite Annuit?"
      a: "Inglés, español y chino. Elija el idioma de cada cliente y todos los mensajes que Annuit redacte para él lo usarán."
    - q: "¿Puedo verlo antes de comprar?"
      a: "Sí. Agende una demo y revisaremos un cliente de ejemplo con usted."
    - q: "¿Dónde se guardan los documentos de mis clientes?"
      a: "Consulte la página de Seguridad para ver cómo Annuit guarda y protege los datos."

security_page:
  title: "Seguridad"
  headline: "Los documentos de sus clientes son privados, están cifrados y son suyos"
  sub: "Los preparadores de impuestos son responsables de los datos de sus clientes. Así le ayuda Annuit a cumplir con esa responsabilidad."
  wisp_title: "Annuit y su Plan Escrito de Seguridad de la Información (WISP)"
  wisp_body: "Para efectos de seguridad de datos, los profesionales de impuestos se consideran instituciones financieras y deben mantener un plan escrito para proteger los datos de sus clientes. Annuit es uno de los sistemas que ese plan cubre. Puede citar los detalles a continuación en su plan."
  human_title: "Un preparador aprueba cada mensaje"
  human_body: "Annuit lee documentos y redacta seguimientos. Nunca envía nada a un cliente por su cuenta. Cada solicitud sale solo después de que alguien de su firma la revisa."
